<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loan Approval Predictor | AI Powered</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header .icon { font-size: 3rem; }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0.3rem 0;
    }
    .header p { color: #64748b; font-size: 0.95rem; }

    /* Layout */
    .layout {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.5rem;
      align-items: start;
    }
    @media(max-width:860px){ .layout { grid-template-columns: 1fr; } }

    /* Form card */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #38bdf8;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(56,189,248,0.2);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media(max-width:560px){ .grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
    }
    input::placeholder { color: #475569; }
    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }
    select option { background: #1e293b; }

    /* Buttons */
    .actions { display: flex; gap: 1rem; margin-top: 0.5rem; }

    .btn-reset {
      flex: 1;
      padding: 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.06); color: #e2e8f0; }

    .btn-predict {
      flex: 2;
      padding: 0.85rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #818cf8);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn-predict:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-predict:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Result panel */
    .result-panel { position: sticky; top: 1.5rem; }

    .placeholder {
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 3.5rem 2rem;
      text-align: center;
      color: #475569;
    }
    .placeholder .big { font-size: 3rem; margin-bottom: 1rem; }

    /* Spinner */
    .spinner-wrap { text-align: center; padding: 3rem 2rem; color: #64748b; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(56,189,248,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
    }
    .error-box h3 { color: #f87171; margin: 0.5rem 0; }
    .error-box p { color: #94a3b8; font-size: 0.85rem; }
    .error-box code {
      display: inline-block; margin-top: 0.8rem;
      background: rgba(0,0,0,0.3); padding: 0.4rem 0.8rem;
      border-radius: 8px; font-size: 0.8rem; color: #38bdf8;
    }

    /* Result card */
    .result-card {
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .result-card.approved {
      background: linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.06));
      border: 1px solid rgba(16,185,129,.3);
    }
    .result-card.rejected {
      background: linear-gradient(135deg,rgba(239,68,68,.12),rgba(185,28,28,.06));
      border: 1px solid rgba(239,68,68,.3);
    }

    .res-icon { font-size: 4rem; margin-bottom: 0.5rem; }
    .res-label { font-size: 2.2rem; font-weight: 800; margin: 0 0 0.3rem; }
    .approved .res-label { color: #34d399; }
    .rejected .res-label { color: #f87171; }
    .res-conf { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }

    .prob-bars { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; text-align: left; }
    .prob-row { display: flex; align-items: center; gap: 0.7rem; font-size: 0.82rem; color: #94a3b8; }
    .prob-row .lbl { width: 62px; flex-shrink: 0; }
    .prob-row .pct { width: 42px; text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width .8s ease; }
    .bar-a { background: linear-gradient(90deg,#10b981,#34d399); }
    .bar-r { background: linear-gradient(90deg,#ef4444,#f87171); }

    .res-note {
      font-size: 0.82rem; color: #64748b; line-height: 1.6;
      padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="icon">🏦</div>
    <h1>Loan Approval Predictor</h1>
    <p>Fill in the applicant details to get an instant AI-powered loan decision</p>
  </div>

  <div class="layout">
    <!-- Form -->
    <div class="card">
      <form id="loanForm">

        <p class="section-title">👤 Personal Information</p>
        <div class="grid">
          <div class="field">
            <label>Gender</label>
            <select name="gender">
              <option>Male</option><option>Female</option>
            </select>
          </div>
          <div class="field">
            <label>Married</label>
            <select name="married">
              <option>Yes</option><option>No</option>
            </select>
          </div>
          <div class="field">
            <label>Dependents</label>
            <select name="dependents">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3+">3+</option>
            </select>
          </div>
          <div class="field">
            <label>Education</label>
            <select name="education">
              <option>Graduate</option><option>Not Graduate</option>
            </select>
          </div>
          <div class="field">
            <label>Self Employed</label>
            <select name="selfEmployed">
              <option>No</option><option>Yes</option>
            </select>
          </div>
          <div class="field">
            <label>Property Area</label>
            <select name="propertyArea">
              <option>Urban</option><option>Semiurban</option><option>Rural</option>
            </select>
          </div>
        </div>

        <p class="section-title">💰 Financial Information</p>
        <div class="grid">
          <div class="field">
            <label>Applicant Income (₹)</label>
            <input type="number" name="applicantIncome" placeholder="e.g. 5000" required/>
          </div>
          <div class="field">
            <label>Co-applicant Income (₹)</label>
            <input type="number" name="coapplicantIncome" placeholder="e.g. 1500"/>
          </div>
          <div class="field">
            <label>Loan Amount (₹ thousands)</label>
            <input type="number" name="loanAmount" placeholder="e.g. 120" required/>
          </div>
          <div class="field">
            <label>Loan Term (months)</label>
            <select name="loanAmountTerm">
              <option value="12">12</option>
              <option value="60">60</option>
              <option value="120">120</option>
              <option value="180">180</option>
              <option value="240">240</option>
              <option value="300">300</option>
              <option value="360" selected>360 (30 yrs)</option>
              <option value="480">480 (40 yrs)</option>
            </select>
          </div>
          <div class="field full">
            <label>Credit History</label>
            <select name="creditHistory">
              <option value="1">Good (1.0) — Meets all guidelines</option>
              <option value="0">Poor (0.0) — Does not meet guidelines</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
          <button type="submit" class="btn-predict" id="predictBtn">🔍 Predict Now</button>
        </div>
      </form>
    </div>

    <!-- Result Panel -->
    <div class="result-panel">
      <div id="resultArea">
        <div class="placeholder">
          <div class="big">🤖</div>
          <p>Your prediction result will appear here after you submit the form.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/predict';

    document.getElementById('loanForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('predictBtn');
      btn.disabled = true;
      btn.textContent = 'Analyzing...';

      showSpinner();

      const fd = new FormData(this);
      const body = {};
      fd.forEach((v, k) => body[k] = v);

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        showResult(data);
      } catch(err) {
        showError();
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Predict Now';
      }
    });

    function showSpinner() {
      document.getElementById('resultArea').innerHTML = `
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <p>Analyzing application...</p>
        </div>`;
    }

    function showError() {
      document.getElementById('resultArea').innerHTML = `
        <div class="error-box">
          <div style="font-size:2.5rem">⚠️</div>
          <h3>Connection Error</h3>
          <p>Could not connect to the ML API. Make sure the Flask server is running.</p>
          <code>python api/app.py</code>
        </div>`;
    }

    function showResult(d) {
      const isApproved = d.prediction === 1;
      document.getElementById('resultArea').innerHTML = `
        <div class="result-card ${isApproved ? 'approved' : 'rejected'}">
          <div class="res-icon">${isApproved ? '✅' : '❌'}</div>
          <div class="res-label">${d.label}</div>
          <div class="res-conf">Confidence: ${d.confidence}%</div>

          <div class="prob-bars">
            <div class="prob-row">
              <span class="lbl">Approved</span>
              <div class="bar-track"><div class="bar-fill bar-a" style="width:${d.approved_prob}%"></div></div>
              <span class="pct">${d.approved_prob}%</span>
            </div>
            <div class="prob-row">
              <span class="lbl">Rejected</span>
              <div class="bar-track"><div class="bar-fill bar-r" style="width:${d.rejected_prob}%"></div></div>
              <span class="pct">${d.rejected_prob}%</span>
            </div>
          </div>

          <div class="res-note">
            ${isApproved
              ? '🎉 Based on the applicant profile, the loan is likely to be <strong>approved</strong>.'
              : '📋 The profile does not meet approval criteria. Consider improving credit history or reducing loan amount.'}
          </div>
        </div>`;
    }

    function resetForm() {
      document.getElementById('loanForm').reset();
      document.getElementById('resultArea').innerHTML = `
        <div class="placeholder">
          <div class="big">🤖</div>
          <p>Your prediction result will appear here after you submit the form.</p>
        </div>`;
    }
  </script>
</body>
</html>
